let calendarPromise;
async function calendarDay(country,date){if(!calendarPromise)calendarPromise=fetch('./calendar.json').then(r=>{if(!r.ok)throw Error('Kalendář není dostupný');return r.json()}).catch(error=>{calendarPromise=null;throw error});const all=await calendarPromise;const data=all[country]?.[date];if(!data)throw Error('Pro tento den nejsou k dispozici údaje.');return data;}
</script>
<script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const defaults={viewMode:"nsp",country:"cz",tomorrow:true,holidays:true,significant:true,monthFormat:"text",days:0};let cfg=defaults;
try{cfg={...defaults,...JSON.parse(localStorage.getItem("eduvize-holidays-config")||"{}")}}catch{}
function readConfig(){let saved={};try{saved=JSON.parse(localStorage.getItem("eduvize-holidays-config")||"{}")}catch{}const x={...defaults,...saved};if(saved.days===undefined&&saved.nextSix)x.days=6;for(const k of ["viewMode","country","monthFormat","days","tomorrow","holidays","significant"]){if(params.has(k)){const v=params.get(k);x[k]=k==="days"?Number(v):["tomorrow","holidays","significant"].includes(k)?v==="1":v}}x.country=x.country==="sk"?"sk":"cz";x.viewMode=["web","kiosk"].includes(x.viewMode)?x.viewMode:"nsp";x.monthFormat=x.monthFormat==="number"?"number":"text";x.days=Math.max(0,Math.min(6,Math.trunc(Number(x.days)||0)));return x}cfg=readConfig();cfg.viewMode=window.EduvizeOutputModes.mode();
const locale=()=>cfg.country==="sk"?"sk-SK":"cs-CZ";
let displayPolicy=null;
function layout(){
 const web=cfg.viewMode==='web'||cfg.viewMode==='kiosk';document.body.classList.toggle('web-mode',web);
 if(web){document.body.classList.remove('ev-modern');document.body.dataset.segmentLayout='web';displayPolicy={upcomingDays:cfg.days,columns:Math.min(3,cfg.days||1),minFont:12};}
 else displayPolicy=window.EduvizeHolidaysLayout.apply(document.body,cfg,innerWidth,innerHeight);
}
addEventListener('resize',()=>{layout();update()});layout();
function localDate(){const sample=params.get('previewDate');if(params.get('preview')==='1'&&/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(sample||'')){const date=new Date(sample+'T12:00:00');if(!Number.isNaN(date.getTime()))return date;}return new Date(new Date().toLocaleString("en-US",{timeZone:"Europe/Prague"}))}
function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function setText(id,value){$(id).textContent=value}
async function update(){$('names-card').querySelector('.metric-name').textContent=cfg.country==='sk'?'Dnes oslavuje':'Dnes slaví';$('holiday-card').querySelector('.metric-name').textContent=cfg.country==='sk'?'Kalendárne sviatky':'Kalendářní svátky';const now=localDate(),day=iso(now),next=new Date(now);next.setDate(next.getDate()+1);
setText("weekday",new Intl.DateTimeFormat(locale(),{weekday:"long"}).format(now));setText("date",(cfg.monthFormat==="number"?new Intl.DateTimeFormat(locale(),{day:"numeric",month:"2-digit"}).format(now):new Intl.DateTimeFormat(locale(),{day:"numeric",month:"long"}).format(now)));setText("year",String(now.getFullYear()));
$("holiday-card").classList.add("hidden");$("names-card").classList.add("hidden");$("tomorrow").classList.toggle("hidden",!cfg.tomorrow||displayPolicy.upcomingDays>0);
try{const data=await calendarDay(cfg.country,day);$("calendar-status").hidden=true;const hasNameday=data.nameday_status!=="unavailable"&&Boolean(String(data.nameday||"").trim());$("names-card").classList.toggle("hidden",!hasNameday);setText("names",hasNameday?data.nameday:"");const events=(data.holidays||[]).filter(x=>x.type==="significant"?cfg.significant:cfg.holidays);$("holiday-card").classList.toggle("hidden",events.length===0);setText("holiday",events.map(x=>x.name).join(" • "));setText("holiday-note",events.length?events.map(x=>x.type==="significant"?(cfg.country==="sk"?"Pamätný deň":"Významný den"):x.day_off?(cfg.country==="sk"?"Deň pracovného pokoja":"Den pracovního klidu"):(cfg.country==="sk"?"Sviatok – pracovný deň":"Svátek – pracovní den")).filter((x,i,a)=>a.indexOf(x)===i).join(" • "):"");$("names").classList.toggle("long",(data.nameday||"").length>19);if(cfg.tomorrow&&displayPolicy.upcomingDays===0){try{const t=await calendarDay(cfg.country,iso(next));setText("tomorrow",t.nameday_status==="unavailable"?"":(cfg.country==="sk"?"Zajtra: ":"Zítra: ")+(t.nameday||"—"));}catch{setText("tomorrow","");}}await renderUpcoming(now);}catch(e){$("calendar-status").hidden=false;$("calendar-status").textContent="Kalendář se nepodařilo načíst. Zkusíme to znovu při další aktualizaci.";$("names-card").classList.add("hidden");setText("names","");$("holiday-card").classList.add("hidden");setText("tomorrow","");$("upcoming").classList.add("hidden");}}

function eventFilter(e){return e.type==="significant"?cfg.significant:cfg.holidays}
async function renderUpcoming(today){
 const visibleDays=displayPolicy.upcomingDays;
 const panel=$("upcoming"),grid=$("upcoming-grid");panel.querySelector("h2").textContent=(cfg.country==="sk"?"Ďalších ":"Dalších ")+visibleDays+(cfg.country==="sk"?(visibleDays===1?" deň":visibleDays<=4?" dni":" dní"):(visibleDays===1?" den":visibleDays<=4?" dny":" dnů"));panel.setAttribute("aria-label",panel.querySelector("h2").textContent);panel.classList.toggle("hidden",visibleDays===0);grid.replaceChildren();
 if(visibleDays===0)return;
 const dates=Array.from({length:visibleDays},(_,i)=>{const d=new Date(today);d.setDate(today.getDate()+i+1);return d});
 const results=await Promise.all(dates.map(async d=>{try{return await calendarDay(cfg.country,iso(d))}catch{return null}}));
 dates.forEach((d,i)=>{
 const data=results[i],card=document.createElement("article");card.className="upcoming-day";
 const title=document.createElement("div");title.className="upcoming-date";title.textContent=new Intl.DateTimeFormat(locale(),{weekday:"short",day:"numeric",month:cfg.monthFormat==="number"?"numeric":"short"}).format(d);
 const names=document.createElement("div");names.className="upcoming-name";names.textContent=data?.nameday||"";if(!names.textContent)names.classList.add("empty");
 card.append(title,names);
 const events=(data?.holidays||[]).filter(eventFilter);if(events.length){card.classList.add(events.some(e=>e.type!=="significant")?"is-public-holiday":"is-significant-day");const note=document.createElement("div");note.className="upcoming-event"+(!names.textContent?" primary-event":"");note.textContent=events.map(e=>e.name).join(" • ");card.append(note)}
 grid.append(card);
 });
 const columns=Math.max(1,Math.min(visibleDays,displayPolicy.columns));grid.style.setProperty("--calendar-columns",String(columns));grid.style.setProperty("--calendar-rows",String(Math.ceil(visibleDays/columns)));requestAnimationFrame(()=>requestAnimationFrame(fitUpcomingText));
}


function fitUpcomingText(){window.EduvizeHolidaysLayout.fit(document.body,displayPolicy?.minFont||12);}

window.addEventListener("resize",()=>requestAnimationFrame(()=>requestAnimationFrame(fitUpcomingText)));


// Opt-in NSP diagnostics: ?debug=1. Never shown on ordinary display URLs.
if(params.get("debug")==="1"){
 const panel=document.createElement("aside");
 panel.id="nsp-debug";
 panel.className='edu-calendar-debug';
 document.body.append(panel);
 function diagnosticRefresh(){
  const shell=document.querySelector(".shell"),hero=document.querySelector(".hero"),upcoming=document.querySelector(".upcoming"),grid=document.querySelector(".upcoming-grid");
  const rect=e=>e?Math.round(e.getBoundingClientRect().width)+"×"+Math.round(e.getBoundingClientRect().height):"–";
  panel.textContent="EDUVIZE profily v1 | viewport "+innerWidth+"×"+innerHeight+
   " | ratio "+(innerWidth/Math.max(1,innerHeight)).toFixed(2)+
   " | profil "+document.body.dataset.segmentLayout+" | dalších dnů "+displayPolicy.upcomingDays+
   " | shell "+rect(shell)+" | hero "+rect(hero)+
   " | upcoming "+rect(upcoming)+" | grid "+rect(grid)+
   " | cards "+document.querySelectorAll(".upcoming-day").length;
 }
 diagnosticRefresh();
 window.addEventListener("resize",diagnosticRefresh);
 setInterval(diagnosticRefresh,2000);
}
window.EduvizeHolidaysLayout.observe(document.body,()=>displayPolicy?.minFont||12);
update();setInterval(()=>{cfg=readConfig();cfg.viewMode=window.EduvizeOutputModes.mode();layout();update()},60000);

</script><script src="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/segment-display.js?v=20261031-integrity-1"></script><script>if(params.get('preview')==='1'&&params.get('previewDate')){const badge=document.createElement('div');badge.textContent='Ukázka pro datum '+params.get('previewDate');badge.style.cssText='position:fixed;bottom:4px;right:4px;padding:4px 8px;background:var(--ev-surface);color:var(--ev-text);border:1px solid var(--ev-border);font:12px system-ui;z-index:99999';document.body.append(badge);}</script></body></html>
