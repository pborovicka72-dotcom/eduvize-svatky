</style></head><body><main class="shell"><section class="hero"><div><div class="calendar-weekday" id="weekday">—</div><div class="calendar-date" id="date">—</div><div class="calendar-year" id="year">—</div></div><div class="hero-art calendar-art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 15h3M14 15h3"/></svg></div></section><section class="metrics calendar-metrics"><article class="metric calendar-card" id="names-card"><div class="metric-top"><span class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 15h3M14 15h3"/></svg></span><span class="metric-name">Dnes slaví jmeniny</span></div><div class="metric-value" id="names">Načítání…</div><div class="metric-note" id="tomorrow"></div></article><article class="metric calendar-card" id="holiday-card"><div class="metric-top"><span class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 15h3M14 15h3"/></svg></span><span class="metric-name">Kalendářní svátky</span></div><div class="metric-value long" id="holiday">Načítání…</div><div class="metric-note" id="holiday-note"></div></article></section><section id="upcoming" class="upcoming hidden" aria-label="Kalendář na dalších šest dnů"><div class="section-heading"><h2>Dalších 6 dnů</h2></div><div id="upcoming-grid" class="upcoming-grid"></div></section><footer class="footer"><span id="footer">Eduvize • Svátky a jmeniny</span></footer></main><script>
const originalFetch=window.fetch.bind(window);
let calendarPromise;
window.fetch=async function(input,options){
const url=String(input);
if(!url.startsWith("/holidays/api/day"))return originalFetch(input,options);
if(!calendarPromise)calendarPromise=originalFetch("./calendar.json").then(r=>{if(!r.ok)throw Error("Calendar unavailable");return r.json()});
const all=await calendarPromise,q=new URLSearchParams(url.split("?")[1]||""),country=q.get("country")||"cz",day=q.get("date");
const record=all[country]?.[day];
return {ok:!!record,status:record?200:404,json:async()=>record};
};
</script>
<script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const defaults={country:"cz",tomorrow:true,holidays:true,significant:true,monthFormat:"text",days:0};let cfg=defaults;
try{cfg={...defaults,...JSON.parse(localStorage.getItem("eduvize-holidays-config")||"{}")}}catch{}
function readConfig(){let saved={};try{saved=JSON.parse(localStorage.getItem("eduvize-holidays-config")||"{}")}catch{}const x={...defaults,...saved};if(x.days===undefined)x.days=x.nextSix?6:0;for(const k of ["country","monthFormat","days","tomorrow","holidays","significant"]){if(params.has(k)){const v=params.get(k);x[k]=k==="days"?Number(v):["tomorrow","holidays","significant"].includes(k)?v==="1":v}}x.days=Math.max(0,Math.min(6,Number(x.days)||0));return x}cfg=readConfig();
const locale=()=>cfg.country==="sk"?"sk-SK":"cs-CZ";
function layout(){
 const w=document.documentElement.clientWidth,h=document.documentElement.clientHeight;
 const panoramic=w/Math.max(1,h)>2.7;
 document.body.classList.toggle("strip",panoramic);
 document.body.classList.toggle("narrow",w/Math.max(1,h)<.85);
 document.body.dataset.segmentLayout=panoramic?"panoramic":"standard";
}
addEventListener("resize",layout);layout();
function localDate(){return new Date(new Date().toLocaleString("en-US",{timeZone:"Europe/Prague"}))}
function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function setText(id,value){$(id).textContent=value}
async function update(){const now=localDate(),day=iso(now),next=new Date(now);next.setDate(next.getDate()+1);
setText("weekday",new Intl.DateTimeFormat(locale(),{weekday:"long"}).format(now));setText("date",cfg.monthFormat==="number"?new Intl.DateTimeFormat(locale(),{day:"numeric",month:"2-digit"}).format(now):new Intl.DateTimeFormat(locale(),{day:"numeric",month:"long"}).format(now));setText("year",String(now.getFullYear()));
$("holiday-card").classList.add("hidden");$("tomorrow").classList.toggle("hidden",!cfg.tomorrow);
try{const u="/holidays/api/day?country="+cfg.country+"&date="+day;const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const data=await r.json();setText("names",data.nameday_status==="unavailable"?(cfg.country==="sk"?"Kalendár sa pripravuje":"Kalendář se připravuje"):(data.nameday||"—"));const events=data.holidays.filter(x=>x.type==="significant"?cfg.significant:cfg.holidays);$("holiday-card").classList.toggle("hidden",events.length===0);setText("holiday",events.map(x=>x.name).join(" • "));setText("holiday-note",events.length?events.map(x=>x.type==="significant"?(cfg.country==="sk"?"Pamätný deň":"Významný den"):x.day_off?(cfg.country==="sk"?"Deň pracovného pokoja":"Den pracovního klidu"):(cfg.country==="sk"?"Sviatok – pracovný deň":"Svátek – pracovní den")).filter((x,i,a)=>a.indexOf(x)===i).join(" • "):"");$("names").classList.toggle("long",(data.nameday||"").length>19);if(cfg.tomorrow){const q=await fetch("/holidays/api/day?country="+cfg.country+"&date="+iso(next),{cache:"no-store"});if(q.ok){const t=await q.json();setText("tomorrow",t.nameday_status==="unavailable"?"":(cfg.country==="sk"?"Zajtra: ":"Zítra: ")+(t.nameday||"—"))}}await renderUpcoming(now);setText("footer","Eduvize • Svátky a jmeniny • "+(data.source||"Kalendářní data"))}catch(e){setText("names","Údaje nejsou dostupné");$("holiday-card").classList.add("hidden");setText("tomorrow","");$("upcoming").classList.add("hidden");setText("footer","Eduvize • Nepodařilo se načíst kalendářní údaje")}}

function eventFilter(e){return e.type==="significant"?cfg.significant:cfg.holidays}
async function renderUpcoming(today){
 const panel=$("upcoming"),grid=$("upcoming-grid");panel.querySelector("h2").textContent=(cfg.country==="sk"?"Ďalších ":"Dalších ")+cfg.days+(cfg.days===1?" den":cfg.days>=2&&cfg.days<=4?" dny":" dnů");panel.classList.toggle("hidden",cfg.days===0);grid.replaceChildren();
 if(cfg.days===0)return;
 const dates=Array.from({length:cfg.days},(_,i)=>{const d=new Date(today);d.setDate(today.getDate()+i+1);return d});
 const results=await Promise.all(dates.map(async d=>{try{const r=await fetch("/holidays/api/day?country="+cfg.country+"&date="+iso(d));return r.ok?await r.json():null}catch{return null}}));
 dates.forEach((d,i)=>{
 const data=results[i],card=document.createElement("article");card.className="upcoming-day";
 const title=document.createElement("div");title.className="upcoming-date";title.textContent=new Intl.DateTimeFormat(locale(),{weekday:"short",day:"numeric",month:cfg.monthFormat==="number"?"numeric":"short"}).format(d);
 const names=document.createElement("div");names.className="upcoming-name";names.textContent=data?.nameday||"";if(!names.textContent)names.classList.add("empty");
 card.append(title,names);
 const events=(data?.holidays||[]).filter(eventFilter);if(events.length){card.classList.add(events.some(e=>e.type!=="significant")?"is-public-holiday":"is-significant-day");const note=document.createElement("div");note.className="upcoming-event"+(!names.textContent?" primary-event":"");note.textContent=events.map(e=>e.name).join(" • ");card.append(note)}
 grid.append(card);
 });
 requestAnimationFrame(fitUpcomingText);
}


function fitUpcomingText(){
 document.querySelectorAll(".upcoming-event,.upcoming-name").forEach(el=>{
  el.style.fontSize="";
  const parent=el.closest(".upcoming-day");
  if(!parent)return;
  const base=parseFloat(getComputedStyle(el).fontSize);
  const min=9;
  // Measure the longest complete word using the actual rendered font.
  const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");
  const cs=getComputedStyle(el);
  ctx.font=[cs.fontStyle,cs.fontWeight,base+"px",cs.fontFamily].join(" ");
  const available=el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-parseFloat(cs.borderLeftWidth)-parseFloat(cs.borderRightWidth);
  const words=el.textContent.trim().split(/\\s+/);
  const longest=Math.max(0,...words.map(w=>ctx.measureText(w).width));
  if(available>0&&longest>available){
   const target=Math.max(min,Math.floor(base*available/longest*0.96));
   el.style.fontSize=target+"px";
  }
  // Extremely narrow containers: prevent painting into neighboring cards.
  el.style.overflow="hidden";
 });
}
window.addEventListener("resize",()=>requestAnimationFrame(fitUpcomingText));


// Opt-in NSP diagnostics: ?debug=1. Never shown on ordinary display URLs.
if(params.get("debug")==="1"){
 const panel=document.createElement("aside");
 panel.id="nsp-debug";
 panel.style.cssText="position:fixed!important;z-index:2147483647!important;right:3px!important;bottom:3px!important;max-width:96vw!important;padding:5px 8px!important;border:2px solid #ffcc00!important;border-radius:4px!important;background:#111!important;color:#fff!important;font:700 13px/1.35 monospace!important;white-space:pre-wrap!important;pointer-events:none!important;box-sizing:border-box!important";
 document.body.append(panel);
 function diagnosticRefresh(){
  const shell=document.querySelector(".shell"),hero=document.querySelector(".hero"),upcoming=document.querySelector(".upcoming"),grid=document.querySelector(".upcoming-grid");
  const rect=e=>e?Math.round(e.getBoundingClientRect().width)+"×"+Math.round(e.getBoundingClientRect().height):"–";
  panel.textContent="EDUVIZE TEST b179→diag1 | viewport "+innerWidth+"×"+innerHeight+
   " | ratio "+(innerWidth/Math.max(1,innerHeight)).toFixed(2)+
   " | strip "+document.body.classList.contains("strip")+
   " | shell "+rect(shell)+" | hero "+rect(hero)+
   " | upcoming "+rect(upcoming)+" | grid "+rect(grid)+
   " | cards "+document.querySelectorAll(".upcoming-day").length;
 }
 diagnosticRefresh();
 window.addEventListener("resize",diagnosticRefresh);
 setInterval(diagnosticRefresh,2000);
}
update();setInterval(()=>{cfg=readConfig();update()},60000);
</script></body></html>
