const originalFetch=window.fetch.bind(window);
let calendarPromise;
window.fetch=async function(input,options){
const url=String(input);
if(!url.startsWith("/holidays/api/day"))return originalFetch(input,options);
if(!calendarPromise)calendarPromise=originalFetch("./calendar.json").then(r=>{if(!r.ok)throw Error("Calendar unavailable");return r.json()});
const all=await calendarPromise,q=new URLSearchParams(url.split("?")[1]||""),country=q.get("country")||"cz",day=q.get("date");
const record=all[country]?.[day];
return {ok:!!record,status:record?200:404,json:async()=>record};
};

<script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const defaults={viewMode:"nsp",country:"cz",tomorrow:true,holidays:true,significant:true,monthFormat:"text",days:0};let cfg=defaults;
try{cfg={...defaults,...JSON.parse(localStorage.getItem("eduvize-holidays-config")||"{}")}}catch{}
function readConfig(){let saved={};try{saved=JSON.parse(localStorage.getItem("eduvize-holidays-config")||"{}")}catch{}const x={...defaults,...saved};if(x.days===undefined)x.days=x.nextSix?6:0;for(const k of ["viewMode","country","monthFormat","days","tomorrow","holidays","significant"]){if(params.has(k)){const v=params.get(k);x[k]=k==="days"?Number(v):["tomorrow","holidays","significant"].includes(k)?v==="1":v}}x.days=Math.max(0,Math.min(6,Number(x.days)||0));return x}cfg=readConfig();
const locale=()=>cfg.country==="sk"?"sk-SK":"cs-CZ";
function layout(){
 const web=cfg.viewMode==="web";

 if(web){
  document.body.classList.remove("strip","narrow","zone-narrow","zone-small","zone-wide");
  delete document.body.dataset.nspWideLocked;
  const upcoming=document.getElementById("upcoming"),grid=document.getElementById("upcoming-grid");
  if(upcoming&&grid&&grid.parentElement!==upcoming)upcoming.appendChild(grid);
  document.body.dataset.segmentLayout="standard";
  return;
 }
 const w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;
 const ratio=w/Math.max(1,h);
 const panoramic=ratio>2.7;

 // NSP may report ~1921x1076 or ~1921x1083 for the upper-right panel.
 // Keep the existing days=0 distinction for the lower-left compact panel.
 // Lock the upper-right detailed layout after its first reliable detection,
 // so transient viewport changes cannot switch it to another CSS mode.

  document.body.dataset.nspWideLocked="1";

 const lockedWide=document.body.dataset.nspWideLocked==="1";
 document.body.classList.toggle("strip",!lockedWide&&panoramic);
 document.body.classList.toggle("zone-narrow",!lockedWide&&!panoramic&&ratio<0.90);
 document.body.classList.toggle("zone-small",!lockedWide&&!panoramic&&ratio>=1.10&&ratio<=2.7&&cfg.days===0);
 document.body.classList.toggle("zone-wide",lockedWide||(!panoramic&&ratio>=1.10&&ratio<=2.7&&cfg.days>0));
 const metrics=document.querySelector(".calendar-metrics"),upcoming=document.getElementById("upcoming"),grid=document.getElementById("upcoming-grid");
 if(metrics&&upcoming&&grid){
   if(document.body.classList.contains("zone-narrow")){
     if(grid.parentElement!==metrics)metrics.appendChild(grid);
   }else if(grid.parentElement!==upcoming)upcoming.appendChild(grid);

}
addEventListener("resize",layout);layout();
/* Keep the full month name visible in the fixed-width lower-right header.
   The blue panel width stays unchanged; only the date font scales down if needed. */
function fitStripDate(){
 const el=document.getElementById("date");
 if(!el)return;
 el.style.removeProperty("font-size");
 if(!document.body.classList.contains("strip"))return;
 const box=el.parentElement;
 const available=Math.max(0,box.clientWidth-12);
 if(!available)return;
 const style=getComputedStyle(el);
 const base=parseFloat(style.fontSize);
 const canvas=document.createElement("canvas");
 const ctx=canvas.getContext("2d");
 if(!ctx||!base)return;
 ctx.font=style.font;
 const measured=ctx.measureText(el.textContent||"").width;

}
function localDate(){return new Date(new Date().toLocaleString("en-US",{timeZone:"Europe/Prague"}))}
function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function setText(id,value){$(id).textContent=value}
async function update(){const now=localDate(),day=iso(now),next=new Date(now);next.setDate(next.getDate()+1);
setText("weekday",new Intl.DateTimeFormat(locale(),{weekday:"long"}).format(now));setText("date",document.body.classList.contains("strip")?new Intl.DateTimeFormat(locale(),{day:"numeric",month:"long"}).format(now):(cfg.monthFormat==="number"?new Intl.DateTimeFormat(locale(),{day:"numeric",month:"2-digit"}).format(now):new Intl.DateTimeFormat(locale(),{day:"numeric",month:"long"}).format(now)));setText("year",String(now.getFullYear()));requestAnimationFrame(fitStripDate);
$("holiday-card").classList.add("hidden");$("tomorrow").classList.toggle("hidden",!cfg.tomorrow||cfg.days>0);
try{const u="/holidays/api/day?country="+cfg.country+"&date="+day;const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const data=await r.json();setText("names",data.nameday_status==="unavailable"?(cfg.country==="sk"?"Kalendár sa pripravuje":"Kalendář se připravuje"):(data.nameday||"—"));const events=data.holidays.filter(x=>x.type==="significant"?cfg.significant:cfg.holidays);setText("hero-nameday",data.nameday||"");setText("hero-holiday",events.map(x=>x.name).join(" • "));$("hero-today").classList.toggle("hidden",!(data.nameday||events.length));$("hero-holiday").classList.toggle("hidden",!events.length);$("holiday-card").classList.toggle("hidden",events.length===0);setText("holiday",events.map(x=>x.name).join(" • "));setText("holiday-note",events.length?events.map(x=>x.type==="significant"?(cfg.country==="sk"?"Pamätný deň":"Významný den"):x.day_off?(cfg.country==="sk"?"Deň pracovného pokoja":"Den pracovního klidu"):(cfg.country==="sk"?"Sviatok – pracovný deň":"Svátek – pracovní den")).filter((x,i,a)=>a.indexOf(x)===i).join(" • "):"");$("names").classList.toggle("long",(data.nameday||"").length>19);if(cfg.tomorrow&&cfg.days===0){const q=await fetch("/holidays/api/day?country="+cfg.country+"&date="+iso(next),{cache:"no-store"});if(q.ok){const t=await q.json();setText("tomorrow",t.nameday_status==="unavailable"?"":(cfg.country==="sk"?"Zajtra: ":"Zítra: ")+(t.nameday||"—"))}}await renderUpcoming(now);}catch(e){setText("names","Údaje nejsou dostupné");setText("hero-nameday","");setText("hero-holiday","");$("holiday-card").classList.add("hidden");setText("tomorrow","");$("upcoming").classList.add("hidden");}}

function eventFilter(e){return e.type==="significant"?cfg.significant:cfg.holidays}
async function renderUpcoming(today){

 dates.forEach((d,i)=>{

function fitUpcomingText(){
 document.querySelectorAll(".upcoming-event,.upcoming-name").forEach(el=>{
  el.style.fontSize="";
  const parent=el.closest(".upcoming-day");
  if(!parent)return;
  const base=parseFloat(getComputedStyle(el).fontSize);
  const min=9;
  // Measure the longest complete word using the actual rendered font.
  const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");
  const cs=getComputedStyle(el);
  ctx.font=[cs.fontStyle,cs.fontWeight,base+"px",cs.fontFamily].join(" ");

  const words=el.textContent.trim().split(/\s+/);
  const longest=Math.max(0,...words.map(w=>ctx.measureText(w).width));
  if(available>0&&longest>available){
   const target=Math.max(min,Math.floor(base*available/longest*0.96));
   el.style.fontSize=target+"px";
  }

  el.style.overflow="hidden";

function fitPanoramicText(){
