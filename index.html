<script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const defaults={viewMode:"nsp",country:"cz",tomorrow:true,holidays:true,significant:true,monthFormat:"text",days:0};let cfg=defaults;

const locale=()=>cfg.country==="sk"?"sk-SK":"cs-CZ";
function layout(){const web=cfg.viewMode==='web';document.body.classList.toggle('web-mode',web);document.body.classList.toggle('strip',!web&&innerWidth/Math.max(1,innerHeight)>2.7);document.body.dataset.segmentLayout=web?'standard':document.body.classList.contains('strip')?'panoramic':'standard';}

/* Keep the full month name visible in the fixed-width lower-right header.
   The blue panel width stays unchanged; only the date font scales down if needed. */
function fitStripDate(){
 const el=document.getElementById("date");
 if(!el)return;
 el.style.removeProperty("font-size");
 if(!document.body.classList.contains("strip"))return;
 const box=el.parentElement;
 const available=Math.max(0,box.clientWidth-12);
 if(!available)return;
 const style=getComputedStyle(el);
 const base=parseFloat(style.fontSize);
 const canvas=document.createElement("canvas");
 const ctx=canvas.getContext("2d");
 if(!ctx||!base)return;
 ctx.font=style.font;
 const measured=ctx.measureText(el.textContent||"").width;
 if(measured>available)el.style.setProperty("font-size",Math.max(12,base*available/measured*.98)+"px","important");
}
function localDate(){return new Date(new Date().toLocaleString("en-US",{timeZone:"Europe/Prague"}))}
function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function setText(id,value){$(id).textContent=value}
async function update(){$('names-card').querySelector('.metric-name').textContent=cfg.country==='sk'?'Dnes oslavuje':'Dnes slaví';$('holiday-card').querySelector('.metric-name').textContent=cfg.country==='sk'?'Kalendárne sviatky':'Kalendářní svátky';const now=localDate(),day=iso(now),next=new Date(now);next.setDate(next.getDate()+1);

function eventFilter(e){return e.type==="significant"?cfg.significant:cfg.holidays}
async function renderUpcoming(today){
 const panel=$("upcoming"),grid=$("upcoming-grid");panel.querySelector("h2").textContent=(cfg.country==="sk"?"Ďalších ":"Dalších ")+cfg.days+(cfg.country==="sk"?(cfg.days===1?" deň":cfg.days<=4?" dni":" dní"):(cfg.days===1?" den":cfg.days<=4?" dny":" dnů"));panel.setAttribute("aria-label",panel.querySelector("h2").textContent);panel.classList.toggle("hidden",cfg.days===0);grid.replaceChildren();

 const results=await Promise.all(dates.map(async d=>{try{return await calendarDay(cfg.country,iso(d))}catch{return null}}));
 dates.forEach((d,i)=>{

function fitUpcomingText(){
 document.querySelectorAll(".upcoming-event,.upcoming-name").forEach(el=>{
  el.style.fontSize="";
  const parent=el.closest(".upcoming-day");
  if(!parent)return;
  const base=parseFloat(getComputedStyle(el).fontSize);
  const min=9;
  // Measure the longest complete word using the actual rendered font.
  const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");
  const cs=getComputedStyle(el);
  ctx.font=[cs.fontStyle,cs.fontWeight,base+"px",cs.fontFamily].join(" ");
  const available=el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-parseFloat(cs.borderLeftWidth)-parseFloat(cs.borderRightWidth);
  const words=el.textContent.trim().split(/\s+/);
  const longest=Math.max(0,...words.map(w=>ctx.measureText(w).width));
  if(available>0&&longest>available){
   const target=Math.max(min,Math.floor(base*available/longest*0.96));
   el.style.fontSize=target+"px";
  }
  // Extremely narrow containers: prevent painting into neighboring cards.

 });
 fitPanoramicText();
}

function fitPanoramicText(){
 if(innerWidth/Math.max(1,innerHeight)<2.7)return;
 document.querySelectorAll(".upcoming-day").forEach(card=>{
  const elements=[...card.querySelectorAll(".upcoming-date,.upcoming-name,.upcoming-event")];
  const available=card.clientHeight-parseFloat(getComputedStyle(card).paddingTop)-parseFloat(getComputedStyle(card).paddingBottom);
  let used=elements.reduce((sum,el)=>sum+el.getBoundingClientRect().height+parseFloat(getComputedStyle(el).marginTop||"0"),0);
  if(used>available&&available>0){const factor=Math.max(.35,available/used*.95);
   for(const el of elements){const n=parseFloat(getComputedStyle(el).fontSize);el.style.setProperty("font-size",Math.max(10,Math.floor(n*factor))+"px");}
  }
 });
}
