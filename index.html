<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eduvize | Svátky a jmeniny</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#142c46;background:#eaf2f8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:linear-gradient(135deg,#eef5fb,#e7f2f6)}.shell{height:100dvh;width:100%;padding:clamp(8px,1.5vmin,28px);display:flex;flex-direction:column;gap:clamp(8px,1.3vmin,20px)}.hero{flex:0 0 auto;min-height:0;border-radius:clamp(12px,2vmin,28px);padding:clamp(15px,2.6vmin,42px);background:linear-gradient(112deg,#0c2e54 4%,#075c86 60%,#009f9c 120%);color:white;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-8%;top:-90%;width:60vmin;height:60vmin;border:2px solid #ffffff20;border-radius:50%;box-shadow:0 0 0 35px #ffffff09,0 0 0 75px #ffffff08;pointer-events:none}.eyebrow{font-size:clamp(12px,1.5vmin,24px);letter-spacing:.13em;text-transform:uppercase;font-weight:750;color:#c5f5ed}.date{font-size:clamp(35px,6.2vmin,105px);font-weight:800;line-height:1.1;letter-spacing:-.05em;margin:.12em 0}.weekday{font-size:clamp(15px,2vmin,34px);color:#d5edf2}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.3vmin,20px);flex:1;min-height:0}.card{min-height:0;background:#fff;border-radius:clamp(12px,2vmin,26px);padding:clamp(16px,3vmin,48px);display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative}.card:after{content:"";position:absolute;right:-35px;bottom:-50px;width:145px;height:145px;background:#eff9f8;border-radius:50%;pointer-events:none}.card-title{font-size:clamp(14px,2vmin,29px);color:#087c91;font-weight:750;display:flex;gap:.5em;align-items:center}.card-value{font-size:clamp(28px,5.2vmin,88px);line-height:1.14;letter-spacing:-.04em;font-weight:800;margin:.28em 0;overflow-wrap:anywhere;z-index:1}.card-value.long{font-size:clamp(21px,3.3vmin,52px);letter-spacing:-.02em}.card-note{font-size:clamp(13px,1.7vmin,26px);color:#638098;z-index:1}.footer{font-size:clamp(10px,1.2vmin,16px);color:#607c90;text-align:center}.hidden{display:none!important}body.narrow .cards{grid-template-columns:1fr}body.narrow .hero{padding:clamp(12px,2vh,26px)}body.narrow .card{padding:clamp(12px,2vh,30px)}body.narrow .card-value{font-size:clamp(24px,5vh,64px)}body.narrow .card-value.long{font-size:clamp(19px,3.2vh,43px)}body.strip .shell{flex-direction:row;align-items:stretch;padding:clamp(5px,1vh,12px)}body.strip .hero{flex:0 0 29%;display:flex;flex-direction:column;justify-content:center}body.strip .date{font-size:clamp(24px,8vh,78px)}body.strip .cards{flex:1}body.strip .card-value{font-size:clamp(20px,7vh,65px)}body.strip .card-value.long{font-size:clamp(17px,4vh,38px)}body.strip .card{padding:clamp(8px,2vh,22px)}body.strip .footer{display:none}body.strip .card-title{font-size:clamp(12px,3vh,21px)}body.strip .card-note{font-size:clamp(11px,2.4vh,18px)}body.strip .eyebrow{font-size:clamp(10px,2.7vh,18px)}body.strip .weekday{font-size:clamp(12px,3vh,23px)}body.strip .shell{gap:clamp(5px,1vw,14px)}
</style></head><body><main class="shell"><header class="hero"><div class="eyebrow" id="region">Český kalendář</div><div class="date" id="date">—</div><div class="weekday" id="weekday"></div></header><section class="cards"><article class="card" id="names-card"><div class="card-title">✦ Dnes slaví jmeniny</div><div class="card-value" id="names">Načítání…</div><div class="card-note" id="tomorrow"></div></article><article class="card" id="holiday-card"><div class="card-title">▣ Kalendářní svátky</div><div class="card-value long" id="holiday">Načítání…</div><div class="card-note" id="holiday-note"></div></article></section><footer class="footer" id="footer">Eduvize • Svátky a jmeniny</footer></main>
<script>
const originalFetch=window.fetch.bind(window);
let calendarPromise;
window.fetch=async function(input,options){
const url=String(input);
if(!url.startsWith("/holidays/api/day"))return originalFetch(input,options);
if(!calendarPromise)calendarPromise=originalFetch("./calendar.json").then(r=>{if(!r.ok)throw Error("Calendar unavailable");return r.json()});
const all=await calendarPromise,q=new URLSearchParams(url.split("?")[1]||""),country=q.get("country")||"cz",day=q.get("date");
const record=all[country]?.[day];
return {ok:!!record,status:record?200:404,json:async()=>record};
};
</script>
<script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const defaults={country:"cz",tomorrow:true,holidays:true,significant:true};let cfg=defaults;
try{cfg={...defaults,...JSON.parse(localStorage.getItem("eduvize-holidays-config")||"{}")}}catch{}
if(["cz","sk"].includes(params.get("country")))cfg.country=params.get("country");
const locale=()=>cfg.country==="sk"?"sk-SK":"cs-CZ";
function layout(){const w=innerWidth,h=innerHeight;document.body.classList.toggle("strip",w/h>2.7);document.body.classList.toggle("narrow",w/h<.85)}
addEventListener("resize",layout);layout();
function localDate(){return new Date(new Date().toLocaleString("en-US",{timeZone:"Europe/Prague"}))}
function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function setText(id,value){$(id).textContent=value}
async function update(){const now=localDate(),day=iso(now),next=new Date(now);next.setDate(next.getDate()+1);
setText("region",cfg.country==="sk"?"Slovenský kalendár":"Český kalendář");setText("date",new Intl.DateTimeFormat(locale(),{day:"numeric",month:"long"}).format(now));setText("weekday",new Intl.DateTimeFormat(locale(),{weekday:"long",year:"numeric"}).format(now));
$("holiday-card").classList.toggle("hidden",!cfg.holidays&&!cfg.significant);$("tomorrow").classList.toggle("hidden",!cfg.tomorrow);
try{const u="/holidays/api/day?country="+cfg.country+"&date="+day;const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const data=await r.json();setText("names",data.nameday_status==="unavailable"?(cfg.country==="sk"?"Kalendár sa pripravuje":"Kalendář se připravuje"):(data.nameday||"—"));const events=data.holidays.filter(x=>x.type==="significant"?cfg.significant:cfg.holidays);setText("holiday",events.length?events.map(x=>x.name).join(" • "):(cfg.country==="sk"?"Dnes nie je sviatok":"Dnes není svátek"));setText("holiday-note",events.length?events.map(x=>x.type==="significant"?(cfg.country==="sk"?"Pamätný deň":"Významný den"):x.day_off?(cfg.country==="sk"?"Deň pracovného pokoja":"Den pracovního klidu"):(cfg.country==="sk"?"Sviatok – pracovný deň":"Svátek – pracovní den")).filter((x,i,a)=>a.indexOf(x)===i).join(" • "):"");$("names").classList.toggle("long",(data.nameday||"").length>19);if(cfg.tomorrow){const q=await fetch("/holidays/api/day?country="+cfg.country+"&date="+iso(next),{cache:"no-store"});if(q.ok){const t=await q.json();setText("tomorrow",t.nameday_status==="unavailable"?"":(cfg.country==="sk"?"Zajtra: ":"Zítra: ")+(t.nameday||"—"))}}setText("footer","Eduvize • Svátky a jmeniny • "+(data.source||"Kalendářní data"))}catch(e){setText("names","Údaje nejsou dostupné");setText("holiday","Údaje nejsou dostupné");setText("tomorrow","");setText("footer","Eduvize • Nepodařilo se načíst kalendářní údaje")}}
update();setInterval(()=>{try{const next={...defaults,...JSON.parse(localStorage.getItem("eduvize-holidays-config")||"{}")};if(params.get("country"))next.country=params.get("country");cfg=next}catch{}update()},60000);
</script></body></html>
