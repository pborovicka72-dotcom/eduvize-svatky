name: Calendar validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s tests -p test_import_namedays.py -v
      - run: python -m unittest discover -s tests -p test_settings.py -v
