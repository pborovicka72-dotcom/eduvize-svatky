name: Calendar regression tests
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/calendar.test.mjs && node tests/reading.test.mjs && node tests/public-config.test.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
