name: Calendar regression tests
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/calendar.test.mjs && node tests/reading.test.mjs && node tests/public-config.test.mjs
      - uses: actions/checkout@v4
        with:
          repository: pborovicka72-dotcom/eduvize-admin
          ref: 162cd485b4b1150a207a7c1c32344b990c2f9933
          path: shared-admin
      - run: pip install -e . 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'psycopg[binary]>=3.2,<4'
      - run: python -m unittest discover -s tests -p 'test_*.py'
        env:
          PYTHONPATH: .:shared-admin
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: eduvize-svatky
      - uses: actions/checkout@v4
        with:
          repository: pborovicka72-dotcom/eduvize-admin
          ref: 162cd485b4b1150a207a7c1c32344b990c2f9933
          path: shared-admin
      - uses: actions/checkout@v4
        with:
          repository: pborovicka72-dotcom/eduvize-styly
          ref: 9c200dd0b8f8d579e275fc76ad29ec9ccf13735f
          path: shared-styly
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ./eduvize-svatky 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'uvicorn>=0.30,<1' 'psycopg[binary]>=3.2,<4'
      - run: npm install --no-save playwright@1.62.1 && npx playwright install --with-deps chromium
      - name: Start isolated shared registry and run published browser cases
        env:
          PYTHONPATH: ${{ github.workspace }}/eduvize-svatky:${{ github.workspace }}/eduvize-svatky/tests:${{ github.workspace }}/shared-admin
          HOLIDAYS_TEST_STYLES: ${{ github.workspace }}/shared-styly
        run: |
          python -m uvicorn output_test_server:app --host 127.0.0.1 --port 8794 > /tmp/holidays-test.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8794/api/v1/outputs/schema >/dev/null; then break; fi
            sleep 1
          done
          node eduvize-svatky/tests/published-browser.cjs
          node eduvize-svatky/tests/publication-admin-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holidays-published-browser
          path: |
            eduvize-svatky/audit/published-*
            eduvize-svatky/audit/publication-admin*
