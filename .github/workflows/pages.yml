name: Validate Svátky preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check static preview files
        run: |
          test -s index.html
          test -s config.html
          python -c 'import json; d=json.load(open("calendar.json")); assert len(d["cz"]) > 365 and len(d["sk"]) > 365'
