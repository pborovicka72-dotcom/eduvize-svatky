<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eduvize | Nastavení svátků</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#142c46;background:#eaf2f8}*{box-sizing:border-box}body{margin:0;padding:clamp(16px,4vw,45px);background:linear-gradient(135deg,#eef5fb,#e7f2f6)}main{max-width:750px;margin:auto}header{padding:28px;background:linear-gradient(112deg,#0c2e54,#075c86 60%,#009f9c);border-radius:22px;color:white}h1{margin:0 0 8px}article{background:white;border-radius:20px;padding:28px;margin-top:18px;display:grid;gap:18px}label{font-weight:650;display:grid;gap:8px}select{padding:12px;border:1px solid #b9d4de;border-radius:10px;font:inherit}.check{display:flex;align-items:center;gap:12px}.check input{width:20px;height:20px;accent-color:#008f91}button{background:#087c91;color:white;padding:14px 20px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}p{color:#58758a;line-height:1.5}a{color:#087c91}</style></head><body><main><header><h1>Eduvize – Svátky a jmeniny</h1><div>Samostatná konfigurace zobrazovacího modulu</div></header><article><label>Kalendář<select id="country"><option value="cz">Česká republika</option><option value="sk">Slovensko</option></select></label><label class="check"><input type="checkbox" id="tomorrow"> Zobrazovat také zítřejší jmeniny</label><label class="check"><input type="checkbox" id="holidays"> Zobrazovat státní svátky a dny pracovního klidu</label><label class="check"><input type="checkbox" id="significant"> Zobrazovat významné a památné dny</label><button id="save">Uložit nastavení</button><p id="result" role="status"></p><p>Nastavení se ukládá do tohoto prohlížeče. Pro různé displeje lze zemi určit také přímo v adrese parametrem <code>?country=cz</code> nebo <code>?country=sk</code>.</p><a href="./index.html" target="_blank">Otevřít zobrazení svátků</a></article></main><script>const $=x=>document.getElementById(x);let c={country:"cz",tomorrow:true,holidays:true,significant:true};try{c={...c,...JSON.parse(localStorage.getItem("eduvize-holidays-config")||"{}")}}catch{}$("country").value=c.country;$("tomorrow").checked=c.tomorrow;$("holidays").checked=c.holidays;$("significant").checked=c.significant;$("save").onclick=()=>{localStorage.setItem("eduvize-holidays-config",JSON.stringify({country:$("country").value,tomorrow:$("tomorrow").checked,holidays:$("holidays").checked,significant:$("significant").checked}));$("result").textContent="Nastavení uloženo."}</script></body></html>
